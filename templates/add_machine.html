{% extends "base.html" %}

{% block title %}Add Machine - Machine Management System{% endblock %}

{% block content %}
<h1>Add New Machine</h1>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Machine Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model">
        </div>
        
        <div class="form-group">
            <label for="serial_number">Serial Number</label>
            <input type="text" id="serial_number" name="serial_number">
        </div>
        
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location">
        </div>
        
        <div class="form-group">
            <label for="purchase_date">Purchase Date</label>
            <input type="date" id="purchase_date" name="purchase_date">
        </div>
        
        <div class="form-group">
            <label for="purchase_cost">Purchase Cost ($)</label>
            <input type="number" id="purchase_cost" name="purchase_cost" step="0.01" value="0">
        </div>
        
        <button type="submit" class="btn btn-success">Add Machine</button>
        <a href="{{ url_for('machines') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
